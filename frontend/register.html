<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Smart Personal Finance Dashboard</title>
  <meta name="description" content="Create a new account to unlock algorithmic financial health scoring, AI spending optimizations, and multi-month trend analysis.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                  var(--bg-primary);
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 2.25rem;
      border-radius: var(--radius-xl);
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      animation: fadeIn 0.4s ease-out;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .password-strength-bar {
      height: 4px;
      background: var(--surface-tertiary);
      border-radius: var(--radius-full);
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .password-strength-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-full);
      transition: width 0.3s ease, background-color 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">SmartFinance</span>
          <span class="brand-badge">Intelligence AI</span>
        </div>
      </div>

      <h1 class="auth-title">Create Account 🚀</h1>
      <p class="auth-subtitle">Join thousands optimizing their personal wealth intelligently</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ansh Sharma" required>
          <div class="form-error" id="reg-name-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          <div class="form-error" id="reg-email-error"></div>
        </div>

        <div class="form-group">
          <div class="form-label">
            <label for="reg-password">Password</label>
            <span id="password-strength-text" style="font-size: 0.75rem; color: var(--text-muted);"></span>
          </div>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 8 characters" required>
          <div class="password-strength-bar">
            <div class="password-strength-fill" id="password-strength-fill"></div>
          </div>
          <div class="form-error" id="reg-password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
          <div class="form-error" id="reg-confirm-error"></div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" required checked style="accent-color: var(--indigo);">
            <span>I agree to terms & security policy</span>
          </label>

          <button type="button" class="btn btn-ghost btn-icon-sm theme-toggle-btn" title="Toggle Theme">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </button>
        </div>

        <button type="submit" class="btn btn-emerald btn-lg" style="width: 100%;">
          Create Free Account
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
        Already registered? 
        <a href="login.html" style="color: var(--indigo); font-weight: 700; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
