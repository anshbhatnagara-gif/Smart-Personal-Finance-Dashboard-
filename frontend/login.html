<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Smart Personal Finance Dashboard</title>
  <meta name="description" content="Sign in to your Smart Personal Finance account to access real-time financial health analytics and AI assistance.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                  var(--bg-primary);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      border-radius: var(--radius-xl);
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      animation: fadeIn 0.4s ease-out;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      margin-bottom: 1.75rem;
    }

    .demo-badge-bar {
      background: var(--surface-secondary);
      border: 1px dashed rgba(99, 102, 241, 0.3);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">SmartFinance</span>
          <span class="brand-badge">Intelligence AI</span>
        </div>
      </div>

      <h1 class="auth-title">Welcome back 👋</h1>
      <p class="auth-subtitle">Enter your credentials to access your financial portfolio</p>

      <!-- Quick Demo Credentials Loader -->
      <div class="demo-badge-bar">
        <div>
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--indigo);">Demo Credentials</div>
          <div style="font-size: 0.6875rem; color: var(--text-muted);">ansh@fintech.dev</div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="fill-demo-credentials-btn">
          Auto-Fill
        </button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          <div class="form-error" id="login-email-error"></div>
        </div>

        <div class="form-group">
          <div class="form-label">
            <label for="login-password">Password</label>
            <a href="#" style="font-size: 0.75rem; color: var(--indigo); text-decoration: none;" onclick="showToast('Password Reset', 'In Phase 1, use demo auto-fill credentials.', 'info'); return false;">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <div class="form-error" id="login-password-error"></div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--indigo);">
            <span>Remember me</span>
          </label>

          <button type="button" class="btn btn-ghost btn-icon-sm theme-toggle-btn" title="Toggle Theme">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
        Don't have an account? 
        <a href="register.html" style="color: var(--indigo); font-weight: 700; text-decoration: none;">Create Account</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
